services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ecg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       english_card_game
      POSTGRES_USER:     ecg_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecg_user -d english_card_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js Frontend ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:            production
      DATABASE_URL:        postgresql://ecg_user:${DB_PASSWORD:-changeme}@db:5432/english_card_game
      JWT_SECRET:          ${JWT_SECRET:-change-this-secret-in-production}
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
