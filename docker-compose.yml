services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-20000}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres
    ports:
      - "3000:3000"

networks:
  postgres:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK:-postgresql-server_default}
